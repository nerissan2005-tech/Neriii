<style>
:root {
  --side: #2B1B2E;
  --side-ink: #E8DCE5;
  --bg: #F6EFEC;
  --card: #FFFCFA;
  --ink: #2E2330;
  --muted: #8A7A86;
  --line: #EDE2DF;
  --plum: #5B2E4F;
  --rose: #C46A8A;
  --sun: #F0A43A;
  --peach: #FBEADF;
  --lilac: #EEE8F6;
  --sage: #E5EFE7;
  --blush: #F8E4E7;
  --shadow: 0 1px 2px rgba(43,27,46,.04), 0 10px 28px rgba(43,27,46,.05);
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: .95rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.hand { font-family: "Caveat", "Segoe Script", cursive; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, var(--side) 0 15.5rem, var(--bg) 15.5rem); }
.side {
  background: var(--side); color: var(--side-ink);
  padding: calc(1.75rem + env(safe-area-inset-top, 0px)) 1rem 1.75rem;
  position: sticky; top: 0; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none;
}
.logo { font-family: "Caveat", cursive; font-size: 2.8rem; line-height: 1; color: #fff; margin: 0 .8rem 1.9rem; font-weight: 500; }
.logo .short { display: none; }
.side nav { display: grid; gap: .15rem; }
.side nav button {
  display: flex; gap: .85rem; align-items: center; width: 100%; padding: .62rem .8rem;
  border-radius: .8rem; background: none; border: 0; cursor: pointer; text-align: left; color: var(--side-ink);
  transition: background .15s;
}
.side nav button svg { width: 21px; height: 21px; flex: none; }
.side nav button:hover { background: rgba(255,255,255,.06); }
.side nav button[aria-current="page"] { background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
.side-foot { margin-top: auto; padding: 2rem .8rem 0; color: #CDB8C7; }
.side-foot p { margin: 0; font-family: "Caveat", cursive; font-size: 1.45rem; line-height: 1.3; }
.side-foot svg { width: 3.4rem; height: 3.4rem; margin-top: .6rem; opacity: .7; }

.main { padding: calc(1.6rem + env(safe-area-inset-top, 0px)) 2rem 0; min-width: 0; }
.top { display: flex; align-items: center; gap: 1rem 1.75rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
.greet { flex: 1; min-width: 15rem; display: flex; gap: .9rem; align-items: center; }
.gsun { color: var(--sun); display: grid; flex: none; }
.gsun svg { width: 2.8rem; height: 2.8rem; }
.greet h1 { font-size: 1.6rem; margin: 0; font-weight: 700; letter-spacing: -.015em; line-height: 1.25; }
.greet p { margin: .1rem 0 0; color: var(--muted); font-size: .9rem; }
.clock { text-align: right; font-size: .85rem; color: var(--muted); line-height: 1.3; }
.clock strong { display: block; color: var(--ink); font-size: 1.05rem; }
.search { position: relative; width: min(21rem, 100%); }
.search input {
  width: 100%; border: 1px solid transparent; background: #EFE4E1; border-radius: 999px;
  padding: .7rem 1rem .7rem 2.7rem; -webkit-appearance: none;
}
.search input:focus { background: #fff; border-color: var(--line); }
.search > span { position: absolute; left: .95rem; top: 50%; transform: translateY(-50%); color: var(--muted); display: grid; }
.results {
  position: absolute; z-index: 30; top: calc(100% + .4rem); left: 0; right: 0; list-style: none; margin: 0; padding: .4rem;
  background: var(--card); border: 1px solid var(--line); border-radius: 1rem; box-shadow: 0 14px 34px rgba(43,27,46,.14);
}
.results[hidden] { display: none; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: .55rem .7rem; border-radius: .6rem; cursor: pointer; }
.results button:hover, .results button:focus-visible { background: var(--blush); }
.results small { display: block; color: var(--muted); }
.actions { display: flex; align-items: center; gap: .75rem; }
.bell { position: relative; }
.bell svg { width: 22px; height: 22px; }
.badge {
  position: absolute; top: .1rem; right: .05rem; min-width: 1.05rem; height: 1.05rem; padding: 0 .25rem;
  border-radius: 999px; background: var(--rose); color: #fff; font-size: .65rem; font-weight: 700; display: grid; place-items: center;
}
.avatar {
  width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 2px solid #fff; cursor: pointer; padding: 0;
  background: linear-gradient(160deg, #F6C99F, #C46A8A 60%, #5B2E4F); color: #fff; font-weight: 700; font-size: 1.05rem;
  box-shadow: 0 4px 12px rgba(91,46,79,.25);
}

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 1.25rem; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
.span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-9 { grid-column: span 9; } .span-12 { grid-column: span 12; }
.stack { display: grid; gap: 1.25rem; align-content: start; }

.card {
  position: relative; overflow: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 1.15rem; box-shadow: var(--shadow);
  padding: 1.2rem 1.35rem; display: flex; flex-direction: column; min-width: 0;
}
.t-peach { background: var(--peach); border-color: #F3DCCD; }
.t-lilac { background: var(--lilac); border-color: #E2DAF0; }
.t-sage { background: var(--sage); border-color: #D6E5DA; }
.t-blush { background: var(--blush); border-color: #F0D3D8; }
.card-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .85rem; }
.card-head h2 { font-size: 1.05rem; margin: 0; flex: 1; font-weight: 700; min-width: 0; }
.card-head .ci { display: grid; color: var(--plum); }
.doodle { position: absolute; right: .9rem; bottom: .8rem; width: 3.6rem; height: 3.6rem; color: var(--plum); opacity: .25; pointer-events: none; }
.tag { font-size: .8rem; color: var(--muted); }
.icon-btn {
  width: 2.1rem; height: 2.1rem; border-radius: .65rem; border: 0; background: none; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); flex: none;
}
.icon-btn:hover { background: rgba(43,27,46,.06); }
.icon-btn.sm { width: 1.7rem; height: 1.7rem; color: var(--muted); opacity: 0; }
li:hover .icon-btn.sm, .icon-btn.sm:focus-visible { opacity: 1; }
@media (hover: none) { .icon-btn.sm { opacity: .6; } }
.more { position: relative; margin-top: auto; padding-top: 1rem; font-size: .83rem; color: var(--muted); background: none; border: 0; cursor: pointer; text-align: left; align-self: flex-start; }
.more:hover { color: var(--plum); }
.more::after { content: " ›"; }
.empty { color: var(--muted); font-size: .9rem; margin: .25rem 0; }
.btn {
  padding: .62rem 1.15rem; border-radius: .75rem; border: 1px solid var(--line); background: var(--card);
  cursor: pointer; font-weight: 600;
}
.btn.primary { background: var(--plum); border-color: var(--plum); color: #fff; }
.btn.danger { color: #A33D52; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.field, select, textarea { border: 1px solid var(--line); background: #fff; border-radius: .75rem; padding: .62rem .85rem; }
.field { flex: 1; min-width: 10rem; }
textarea { width: 100%; resize: vertical; line-height: 1.6; }
label.lbl { display: block; font-size: .85rem; font-weight: 600; margin: 1.1rem 0 .4rem; }

.page-head { margin-bottom: 1.5rem; }
.page-head h2 { font-size: 1.45rem; margin: 0; letter-spacing: -.01em; }
.page-head p { margin: .2rem 0 0; color: var(--muted); }

.hero { position: relative; border-radius: 1.15rem; overflow: hidden; min-height: 17.5rem; color: #FFF6F1; box-shadow: var(--shadow); display: flex; align-items: center; }
.hero > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-in { position: relative; padding: 2rem 2.4rem; max-width: 27rem; }
.hero-label { font-size: .8rem; opacity: .85; margin: 0 0 .5rem; display: flex; align-items: center; gap: .4rem; }
.hero-text { font-family: "Caveat", cursive; font-weight: 500; font-size: clamp(2rem, 3.4vw, 2.75rem); line-height: 1.1; margin: 0; text-shadow: 0 2px 16px rgba(40,18,40,.45); }
.hero-copy { margin-top: 1.1rem; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); color: #fff; padding: .42rem 1rem; border-radius: 999px; cursor: pointer; font-size: .82rem; backdrop-filter: blur(4px); }
.hero-copy:hover { background: rgba(255,255,255,.26); }

.art { position: relative; border-radius: 1.15rem; overflow: hidden; min-height: 16rem; box-shadow: var(--shadow); color: #FFF3EA; }
.art > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.art p { position: relative; margin: 0; padding: 1.4rem 1.5rem; font-family: "Caveat", cursive; font-size: 1.75rem; line-height: 1.12; text-shadow: 0 2px 12px rgba(30,15,30,.5); max-width: 12rem; }

.add { display: flex; gap: .4rem; margin-top: .6rem; position: relative; }
.add input { flex: 1; min-width: 0; border: 1px dashed #D9C8C6; background: rgba(255,255,255,.5); border-radius: .65rem; padding: .48rem .75rem; }
ul.checks { list-style: none; margin: 0; padding: 0; position: relative; }
ul.checks li { display: flex; align-items: center; gap: .4rem; }
ul.checks label { flex: 1; display: flex; gap: .75rem; align-items: center; padding: .42rem 0; cursor: pointer; min-width: 0; }
ul.checks label span { overflow-wrap: anywhere; }
ul.checks li.done label span { text-decoration: line-through; color: var(--muted); }
input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
  width: 1.25rem; height: 1.25rem; border: 1.5px solid #B9A8B4; border-radius: 50%; display: grid; place-items: center; background: #fff;
  transition: background .15s, border-color .15s;
}
input[type="checkbox"]:checked { background: var(--plum); border-color: var(--plum); }
input[type="checkbox"]:checked::after { content: ""; width: .32rem; height: .6rem; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.streak { font-size: .78rem; color: var(--rose); font-weight: 700; white-space: nowrap; }

.links { list-style: none; margin: 0; padding: 0; position: relative; }
.links button { background: none; border: 0; padding: .3rem 0; cursor: pointer; text-align: left; width: 100%; display: flex; gap: .55rem; overflow: hidden; }
.links button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.links button::before { content: "•"; color: var(--rose); }
.links button:hover { color: var(--plum); }

.goal { margin-bottom: .95rem; position: relative; }
.goal-top { display: flex; justify-content: space-between; gap: .5rem; font-size: .88rem; font-weight: 600; margin-bottom: .35rem; }
.goal-top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goal-top span:last-child { color: var(--muted); font-weight: 500; font-size: .78rem; flex: none; }
.bar { height: .42rem; background: rgba(91,46,79,.1); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), var(--plum)); border-radius: inherit; }

.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
.cal-head h3 { margin: 0; font-size: .95rem; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .12rem; text-align: center; }
.cal-grid .wd { font-size: .7rem; color: var(--muted); padding-bottom: .3rem; }
.cal-day { border: 0; background: none; border-radius: 50%; aspect-ratio: 1; cursor: pointer; font-size: .8rem; position: relative; display: grid; place-items: center; padding: 0; }
.cal-day:hover { background: var(--blush); }
.cal-day.today { background: var(--plum); color: #fff; font-weight: 700; }
.cal-day.sel { box-shadow: inset 0 0 0 2px var(--sun); }
.cal-day.dot::after { content: ""; position: absolute; bottom: 8%; left: 50%; width: .26rem; height: .26rem; margin-left: -.13rem; border-radius: 50%; background: var(--rose); }
.cal-day.today.dot::after { background: #fff; }
.cal-big .cal-day { aspect-ratio: auto; height: 3.4rem; border-radius: .85rem; font-size: .92rem; }

.weather { display: flex; gap: 1rem; align-items: center; }
.weather .ws { color: var(--sun); display: grid; }
.weather .ws svg { width: 3.2rem; height: 3.2rem; }
.wcity { font-size: .85rem; color: var(--muted); }
.wtemp { font-size: 1.7rem; font-weight: 700; line-height: 1.15; }

.moods { display: flex; flex-wrap: wrap; gap: .4rem; }
.moods button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: .38rem .78rem; cursor: pointer; font-size: .84rem; }
.moods button[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: #fff; }

.ideas { margin-top: 2.5rem; }
.ideas h2 { font-size: 1.15rem; margin: 0 0 1.1rem; }
.ideas-wrap { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 1.25rem; align-items: center; }
.ideas-hand { font-family: "Caveat", cursive; font-size: 1.5rem; line-height: 1.15; color: var(--plum); transform: rotate(-6deg); margin: 0; text-align: center; }
.ideas-hand svg { display: block; width: 3.4rem; height: 2.4rem; margin: .4rem auto 0; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1rem; align-items: stretch; }
.tile {
  background: #F4E8E7; border: 1px solid #EDDDDC; border-radius: 1.1rem; padding: 1.3rem 1rem; text-align: center; cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}
.tile:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(91,46,79,.1); }
.tile-ic { width: 2.9rem; height: 2.9rem; border-radius: 50%; display: grid; place-items: center; margin: 0 auto .8rem; color: #fff; }
.tile h3 { margin: 0 0 .35rem; font-size: .98rem; }
.tile p { margin: 0; font-size: .82rem; color: var(--muted); line-height: 1.45; }

.split { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 1.25rem; align-items: start; }
.item-btn { display: block; width: 100%; text-align: left; border: 0; background: none; padding: .7rem .75rem; border-radius: .75rem; cursor: pointer; }
.item-btn strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-btn span { font-size: .78rem; color: var(--muted); }
.item-btn.active { background: var(--peach); }
.big-title { width: 100%; border: 0; background: none; font-size: 1.4rem; font-weight: 700; padding: .2rem 0 .6rem; }
.big-title:focus-visible, .bare:focus-visible { outline: none; }
.bare { border: 0; background: none; padding: 0; min-height: 22rem; }
.status { color: var(--muted); font-size: .82rem; }

.goal-row { padding: 1rem 0; border-bottom: 1px solid rgba(91,46,79,.1); display: grid; grid-template-columns: 1fr auto; gap: .4rem 1rem; align-items: center; }
.goal-row:last-child { border-bottom: 0; }
.goal-row input[type="range"] { width: 100%; accent-color: var(--plum); }
.goal-row .pct { font-weight: 700; color: var(--plum); min-width: 3rem; text-align: right; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 34rem; }
th, td { padding: .65rem .4rem; border-bottom: 1px solid rgba(91,46,79,.1); text-align: center; }
th { font-size: .78rem; font-weight: 600; color: var(--muted); }
th:first-child, td:first-child { text-align: left; }
td input[type="checkbox"] { margin: 0 auto; }

.entry { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid rgba(91,46,79,.1); padding: .7rem 0; cursor: pointer; }
.entry small { display: block; color: var(--muted); }
.gratitude { display: grid; gap: .5rem; }

.band { margin-top: 3.5rem; }
.band svg { display: block; width: 100%; height: 48px; }
.band div {
  background: var(--side); color: var(--side-ink); text-align: center;
  padding: .4rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: center; gap: 1.25rem;
}
.band p { margin: 0; font-family: "Caveat", cursive; font-size: 1.75rem; }
.band i { display: block; width: 5rem; height: 1px; background: rgba(232,220,229,.4); }


.hero .cat, .aff-hero .cat { background: rgba(255,255,255,.2); color: #fff; }
.cat { display: inline-block; font-size: .74rem; font-weight: 700; padding: .16rem .6rem; border-radius: 999px; background: color-mix(in srgb, var(--c) 15%, white); color: var(--c); white-space: nowrap; }
.aff-hero {
  position: relative; overflow: hidden; border-radius: 1.15rem; padding: 2rem 2.25rem; margin-bottom: 1.25rem; color: #FFF6F1; box-shadow: var(--shadow);
  background: radial-gradient(circle at 86% 22%, rgba(255,240,208,.4), transparent 28%), linear-gradient(135deg, #36234D, #7B4E72 55%, #E59A86);
}
.aff-hero::after {
  content: ""; position: absolute; right: 12%; top: 18%; width: 2.6rem; height: 2.6rem; background: #FFF8E6;
  clip-path: polygon(50% 0, 57% 43%, 100% 50%, 57% 57%, 50% 100%, 43% 57%, 0 50%, 43% 43%);
  filter: drop-shadow(0 0 14px rgba(255,240,200,.9));
}
.aff-top { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; position: relative; }
.aff-count { font-size: .85rem; opacity: .85; }
.aff-big { position: relative; font-family: "Caveat", cursive; font-weight: 500; font-size: clamp(2.2rem, 4.5vw, 3.3rem); line-height: 1.08; margin: 1rem 0 1.4rem; max-width: 20ch; text-shadow: 0 2px 14px rgba(40,18,40,.35); }
.aff-note { position: relative; font-size: .82rem; opacity: .82; margin: 1.1rem 0 0; }
.btn.light { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.35); color: #fff; display: inline-flex; gap: .45rem; align-items: center; }
.btn.light[aria-pressed="true"] { background: #fff; color: var(--plum); }
.btn.light[aria-pressed="true"] svg path { fill: currentColor; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .75rem; }
.chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: .38rem .85rem; cursor: pointer; font-size: .84rem; }
.chips button small { color: var(--muted); margin-left: .25rem; }
.chips button[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: #fff; }
.chips button[aria-pressed="true"] small { color: #E8DCE5; }
.aff-list { list-style: none; margin: 0; padding: 0; }
.aff-list li { display: flex; gap: .5rem; align-items: flex-start; padding: .95rem 0; border-bottom: 1px solid var(--line); }
.aff-list li:last-child { border-bottom: 0; }
.aff-list p { margin: 0 0 .4rem; font-size: 1rem; }
.aff-meta { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-size: .78rem; color: var(--muted); }
.fav { border: 0; background: none; cursor: pointer; color: #C9B5C1; width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border-radius: .65rem; flex: none; }
.fav:hover { background: var(--blush); }
.fav.on { color: var(--rose); }
.fav.on svg path { fill: currentColor; }


[hidden] { display: none !important; }
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: calc(2rem + env(safe-area-inset-top, 0px)) 1rem calc(2rem + env(safe-area-inset-bottom, 0px)); position: relative; overflow: hidden; background: #2B1B2E; }
.login > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.login-card { position: relative; width: min(24rem, 100%); background: rgba(255,252,250,.95); border-radius: 1.4rem; padding: 2.1rem 1.75rem 1.75rem; box-shadow: 0 30px 60px rgba(20,8,20,.4); }
.login-card h1 { font-family: "Caveat", cursive; font-size: 3.2rem; line-height: 1; margin: 0; color: var(--plum); text-align: center; font-weight: 500; }
.login-card .sub { text-align: center; color: var(--muted); margin: .4rem 0 1.4rem; font-size: .92rem; }
.login-card .field { width: 100%; }

function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (typeof v === "boolean") n[k] = v;
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}

function dayIndex(d, len) {
  const n = Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / DAY_MS);
  return ((n % len) + len) % len;

function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const AFF_PER = Math.min(...AFF_CATS.map(c => AFF[c].length));
const AFF_CYCLE = AFF_PER * AFF_CATS.length;
const shuffleCache = {};
function shuffled(cat, cycle) {
  const key = cat + "|" + cycle;
  if (shuffleCache[key]) return shuffleCache[key];
  const a = AFF[cat].slice();
  const r = rng(9157 + cycle * 7919 + AFF_CATS.indexOf(cat) * 131);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return (shuffleCache[key] = a);
}
function affAt(i) {
  const cycle = Math.floor(i / AFF_CYCLE), r = i % AFF_CYCLE;
  const cat = AFF_CATS[r % AFF_CATS.length];
  return { cat, text: shuffled(cat, cycle)[Math.floor(r / AFF_CATS.length)], date: addDays(fromKey(data.affStart), i) };

function addItem(kind, fields, vis) {
  const ref = itemsCol().doc();
  ref.set(Object.assign({ kind, owner: me.uid, ownerName: me.name, vis: vis || "private", at: Date.now(), upd: Date.now(), updName: me.name }, fields)).catch(writeFail);
  return ref.id;
}
const pendingPatch = new Map();
function flushItem(id) {
  const x = pendingPatch.get(id);
  if (!x) return;
  clearTimeout(x.t);
  pendingPatch.delete(id);
  itemsCol().doc(id).update(x.patch).catch(writeFail);
}
function flushItems() { [...pendingPatch.keys()].forEach(flushItem); }
function updItem(it, patch, lazy) {
  Object.assign(it, patch);
  const prev = pendingPatch.get(it.id);
  const p = Object.assign(prev ? prev.patch : {}, patch, { upd: Date.now(), updName: me.name });
  if (prev) clearTimeout(prev.t);
  if (!lazy) { pendingPatch.delete(it.id); itemsCol().doc(it.id).update(p).catch(writeFail); return; }
  pendingPatch.set(it.id, { patch: p, t: setTimeout(() => flushItem(it.id), 600) });
}
function delItem(it, ask) {
  if (ask && !confirm(ask)) return;
  pendingPatch.delete(it.id);
  itemsCol().doc(it.id).delete().catch(writeFail);
}
function toggleHabit(hb, k, on) {
  const F = firebase.firestore;
  itemsCol().doc(hb.id).update(new F.FieldPath("done", me.uid, k), on ? true : F.FieldValue.delete(), "upd", Date.now()).catch(writeFail);
}

function scheduleRender() {
  if (!me) return;
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains("live") && $("view").contains(a)) { pendingRender = true; updateHeader(); return; }
  pendingRender = false;
  render();
}
document.addEventListener("focusout", e => {
  if (!e.target.classList || !e.target.classList.contains("live")) return;
  setTimeout(() => {
    const a = document.activeElement;
    if (a && a.classList && a.classList.contains("live")) return;
    flushItems();
    if (pendingRender) { pendingRender = false; render(); }
  }, 60);
});

function go(view, opts) {
  if (!VIEWS.some(v => v[0] === view) || (view === "admin" && !(me && me.isAdmin))) view = "home";
  state.view = view;
  Object.assign(state, opts || {});
  if (view === "messages") $("toast").hidden = true;
  if (location.hash.slice(1) !== view) history.replaceState(null, "", "#" + view);
  flushItems();
  pendingRender = false;
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (!me) return;
  document.querySelectorAll("#nav button").forEach(b => {
    if (b.dataset.view === state.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const act = document.activeElement;
  const keepId = act && act.id && $("view").contains(act) ? act.id : null;
  const keepVal = keepId && act.type !== "checkbox" && act.type !== "range" && "value" in act ? act.value : null;
  const caret = keepId && typeof act.selectionStart === "number" ? act.selectionStart : null;
  $("view").replaceChildren(RENDER[state.view]());
  updateHeader();
  if (keepId && !state.focus) {
    const f = $(keepId);
    if (f) {
      if (keepVal != null && f.value !== keepVal) f.value = keepVal;
      f.focus();
      if (caret != null && typeof f.setSelectionRange === "function") try { f.setSelectionRange(caret, caret); } catch (e) {}
    }
  }
  if (state.focus) {
    const f = document.querySelector(state.focus);
    if (f) f.focus();
    state.focus = null;
  }
}

let weatherCache = null;
async function loadWeather(box) {
  const paint = () => box.replaceChildren(h("div", { class: "weather" },
    h("span", { class: "ws", html: ico("sun", 48) }),
    h("div", {},
      h("div", { class: "wcity", text: weatherCache.name }),
      h("div", { class: "wtemp", text: weatherCache.temp + "°C" }),
      h("div", { text: WEATHER[weatherCache.code] || "" })
    )
  ));
  if (!data.city) {
    box.replaceChildren(h("div", { class: "weather" },
      h("span", { class: "ws", html: ico("sun", 48) }),
      h("div", {}, h("p", { class: "empty", text: "Hava durumu için şehrini ekle." }),
        h("button", { class: "more", type: "button", style: "padding-top:.2rem", text: "Ayarlar", onclick: () => go("settings", { focus: "#setCity" }) }))
    ));
    return;
  }
  if (weatherCache && weatherCache.city === data.city) return paint();
  box.replaceChildren(h("p", { class: "empty", text: "Hava durumu yükleniyor…" }));
  try {
    const g = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=tr&name=" + encodeURIComponent(data.city))).json();
    if (!g.results || !g.results.length) throw new Error("bulunamadı");
    const r = g.results[0];
    const w = await (await fetch("https://api.open-meteo.com/v1/forecast?current=temperature_2m,weather_code&timezone=auto&latitude=" + r.latitude + "&longitude=" + r.longitude)).json();
    weatherCache = { city: data.city, name: r.name, temp: Math.round(w.current.temperature_2m), code: w.current.weather_code };
    paint();
  } catch (e) {
    box.replaceChildren(h("p", { class: "empty", text: "Hava durumu alınamadı. Ayarlar'daki şehir adını kontrol et." }));
  }
}

const allMessages = () => {
  const m = new Map();
  msgsIn.concat(msgsOut).forEach(x => m.set(x.id, x));
  return [...m.values()].sort((a, b) => a.at - b.at);
};
const unreadCount = () => msgsIn.filter(x => !x.read).length;
const initial = n => (n || "?").trim().charAt(0).toLocaleUpperCase("tr");
const markedRead = new Set();

function renderMessages() {
  const all = allMessages();
  const withUser = uid => all.filter(m => (m.from === uid && m.to === me.uid) || (m.from === me.uid && m.to === uid));
  const unreadFrom = uid => msgsIn.filter(m => m.from === uid && !m.read).length;
  const people = profiles.slice().sort((a, b) => {
    const la = withUser(a.uid).slice(-1)[0], lb = withUser(b.uid).slice(-1)[0];
    return (lb ? lb.at : 0) - (la ? la.at : 0) || a.name.localeCompare(b.name, "tr");
  });
  if (!people.length) {
    return h("div", {}, pageHead("Mesajlar", "Profiller arasında mesajlaş."),
      h("section", { class: "card t-blush", style: "max-width:36rem" },
        h("p", { class: "empty", text: "Henüz başka profil yok. Yönetici yeni bir profil eklediğinde burada onunla mesajlaşabilirsin." }),
        me.isAdmin ? h("button", { class: "more", type: "button", text: "Profil ekle", onclick: () => go("admin", { focus: "#npName" }) }) : null));
  }
  if (!people.some(p => p.uid === state.chatWith)) {
    const firstUnread = people.find(p => unreadFrom(p.uid));
    state.chatWith = (firstUnread || people[0]).uid;
  }
  const other = people.find(p => p.uid === state.chatWith);
  const thread = withUser(other.uid);

  const toMark = thread.filter(m => m.to === me.uid && !m.read && !markedRead.has(m.id));
  if (toMark.length) {
    const batch = db.batch();
    toMark.forEach(m => { markedRead.add(m.id); batch.update(db.collection("messages").doc(m.id), { read: true }); });
    batch.commit().catch(() => toMark.forEach(m => markedRead.delete(m.id)));
  }

  const list = h("section", { class: "card t-peach" },
    h("div", { class: "card-head" }, h("h2", { text: "Kişiler" })),
    h("div", { class: "people" }, people.map(p => {
      const last = withUser(p.uid).slice(-1)[0];
      const un = unreadFrom(p.uid);
      return h("button", { type: "button", "aria-current": p.uid === other.uid ? "true" : "false", onclick: () => { state.chatWith = p.uid; state.focus = "#msgInput"; render(); } },
        h("span", { class: "pav", text: initial(p.name) }),
        h("span", { class: "meta" }, h("strong", { text: p.name }), h("span", { text: last ? (last.from === me.uid ? "Sen: " : "") + last.text : "Henüz mesaj yok" })),
        un ? h("span", { class: "unread", text: String(un) }) : null
      );
    }))
  );

  const box = h("div", { class: "thread" });
  let lastDay = "";
  if (!thread.length) box.append(h("p", { class: "empty", style: "align-self:center;margin:auto", text: other.name + " ile henüz mesajın yok. İlk mesajı sen yaz ♡" }));
  thread.forEach(m => {
    const d = new Date(m.at);
    const dk = keyOf(d);
    if (dk !== lastDay) { lastDay = dk; box.append(h("div", { class: "day-sep", text: dk === todayKey ? "Bugün" : fmtDate.format(d) })); }
    box.append(h("div", { class: "bubble" + (m.from === me.uid ? " mine" : "") }, m.text,
      h("small", { text: fmtTime.format(d) + (m.from === me.uid && m.read ? ", okundu" : "") })));
  });
  setTimeout(() => { box.scrollTop = box.scrollHeight; });

  const send = async () => {
    const input = $("msgInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = ""; state.msgDraft = "";
    try {
      await db.collection("messages").add({ from: me.uid, fromName: me.name, to: other.uid, toName: other.name, text, at: Date.now(), read: false });
    } catch (e) {
      input.value = text; state.msgDraft = text;
      showToast("Mesaj gönderilemedi", "İnternet bağlantını kontrol edip tekrar dene.");
    }
  };

  const chatCard = h("section", { class: "card" },
    h("div", { class: "thread-head" }, h("span", { class: "pav", text: initial(other.name) }), h("strong", { text: other.name })),
    box,
    h("form", { class: "composer", onsubmit: e => { e.preventDefault(); send(); } },
      h("textarea", { id: "msgInput", class: "field", rows: "1", placeholder: other.name + " için bir mesaj yaz…", "aria-label": "Mesaj",
        oninput: e => { state.msgDraft = e.target.value; },
        onkeydown: e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } } }, state.msgDraft || ""),
      h("button", { class: "btn primary", type: "submit", "aria-label": "Gönder", html: ico("send", 18) })
    )
  );

  return h("div", {}, pageHead("Mesajlar", "Profiller arasında mesajlaş, yeni mesajlar anında gelir."), h("div", { class: "chat" }, list, chatCard));
}

let toastTimer = null;
function showToast(title, body, action, actionLabel) {
  const t = $("toast");
  t.replaceChildren(
    h("span", { class: "ti", html: ico(action ? "chat" : "bell", 20) }),
    h("div", { style: "flex:1;min-width:0" },
      h("strong", { text: title }),
      body ? h("p", { text: body }) : null,
      action ? h("button", { class: "btn primary", type: "button", style: "padding:.45rem .9rem;font-size:.85rem", text: actionLabel || "Aç", onclick: () => { t.hidden = true; action(); } }) : null
    ),
    h("button", { class: "icon-btn x", type: "button", "aria-label": "Kapat", html: ico("x", 18), onclick: () => { t.hidden = true; } })
  );
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 9000);
}

const TR_MAP = { "ı": "i", "ğ": "g", "ü": "u", "ş": "s", "ö": "o", "ç": "c" };
const slugOf = n => (n || "").toLocaleLowerCase("tr").replace(/[ığüşöç]/g, c => TR_MAP[c]).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const emailOf = n => n.includes("@") ? n.trim().toLowerCase() : slugOf(n) + "@nerii.app";
function authError(err) {
  const c = (err && err.code) || "";
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-login-credentials", "auth/invalid-email"].includes(c)) return "Profil adı ya da şifre hatalı.";
  if (c === "auth/email-already-in-use") return "Bu isimde bir profil zaten var.";
  if (c === "auth/weak-password") return "Şifre en az 6 karakter olmalı.";
  if (c === "auth/too-many-requests") return "Çok fazla deneme yapıldı, biraz bekleyip tekrar dene.";
  if (c === "auth/network-request-failed") return "İnternet bağlantını kontrol et.";
  if (c === "auth/operation-not-allowed" || c === "auth/admin-restricted-operation") return "Yeni profil oluşturma şu an kapalı.";
  if (c === "auth/requires-recent-login") return "Güvenlik için çıkış yapıp tekrar giriş yapman gerekiyor.";
  return "Bir sorun oluştu, tekrar dene.";
}

const FB_READY = !Object.values(firebaseConfig).some(v => !v || v === "BURAYA");
let pendingName = "";

  $("appRoot").hidden = true;
  $("band").hidden = true;
  const box = $("login");
  box.hidden = false;
  const err = h("p", { class: "err", role: "alert", text: message || "" });
  const form = h("form", { onsubmit: async e => {
    e.preventDefault();
    err.textContent = "";

    if (!pw) { err.textContent = "Şifreni yaz."; return; }
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Giriş yapılıyor…";

        return;
      }
      await auth.signInWithEmailAndPassword(email, pw);

      btn.disabled = false; btn.textContent = "Giriş yap";
    }
  } },
    h("label", { class: "lbl", for: "lgName", text: "Profil adı ya da kullanıcı adı" }),

    h("label", { class: "lbl", for: "lgPass", text: "Şifre" }),
    h("input", { class: "field", id: "lgPass", type: "password", autocomplete: "current-password" }),
    h("button", { class: "btn primary", type: "submit", text: "Giriş yap" }),
    err
  );
  box.replaceChildren(
    h("span", { html: HERO_SVG, style: "position:absolute;inset:0;display:block" }),

      h("p", { class: "sub", text: "Profilinle giriş yap" }),
      FB_READY ? form : h("p", { class: "setup", text: "Giriş sistemi için Firebase ayarlarının index.html içindeki firebaseConfig alanına eklenmesi gerekiyor." })
    )
  );
  box.querySelector("span > svg").style.cssText = "width:100%;height:100%";
  const first = $("lgName");

async function migrateBlob(blob) {
  const rows = [];
  const base = vis => ({ owner: me.uid, ownerName: me.name, vis: vis || "private", upd: Date.now(), updName: me.name });
  (blob.notes || []).forEach(n => rows.push(Object.assign(base(), { kind: "note", title: n.title || "", body: n.body || "", at: n.updated || Date.now() })));
  (blob.goals || []).forEach(g => rows.push(Object.assign(base(), { kind: "goal", text: g.text, area: g.area || "Kişisel", progress: g.progress || 0, at: Date.now() })));
  (blob.habits || []).forEach(hb => rows.push(Object.assign(base(), { kind: "habit", name: hb.name, done: { [me.uid]: hb.done || {} }, at: Date.now() })));
  Object.entries(blob.plan || {}).forEach(([k, arr]) => (arr || []).forEach(p => rows.push(Object.assign(base(), { kind: "plan", text: p.text, date: k, done: !!p.done, at: Date.now() }))));
  (blob.shopping || []).forEach(s => rows.push(Object.assign(base(), { kind: "shop", text: s.text, done: !!s.done, at: Date.now() })));
  (blob.books || []).forEach(b => rows.push(Object.assign(base(), { kind: "book", title: b.title, author: b.author || "", status: b.status || "Okunacak", at: Date.now() })));
  (blob.myAff || []).forEach(a => rows.push(Object.assign(base(), { kind: "aff", text: a.text, cat: a.cat, date: a.date || todayKey, at: Date.now() })));
  for (let i = 0; i < rows.length; i += 400) {
    const batch = db.batch();
    rows.slice(i, i + 400).forEach(r => batch.set(itemsCol().doc(), r));
    await batch.commit();
  }
  ["notes", "goals", "habits", "plan", "shopping", "books", "myAff", "name", "recipes"].forEach(k => { delete data[k]; });
  data.v3 = true;
}

async function resolveEmail(name) {
  if (name.includes("@")) return name.trim().toLowerCase();
  const slug = slugOf(name);
  try {
    const d = await db.collection("logins").doc(slug).get();
    if (d.exists) {
      const x = d.data();
      if (x.moved) return null;
      if (x.email) return x.email;
    }
  } catch (e) {}
  return slug + "@nerii.app";
}

const isRootProfile = p => p.root === true || (me && me.isRoot && p.uid === me.uid);
const profEmail = p => p.email || (p.slug ? p.slug + "@nerii.app" : "");

async function renameProfile(p, newName) {
  newName = (newName || "").trim();
  const newSlug = slugOf(newName);
  if (!newSlug || newName.includes("@")) throw new Error("Geçerli bir kullanıcı adı yaz.");
  if (newName === p.name) return;
  const batch = db.batch();
  if (newSlug !== p.slug) {
    if (allProfiles.some(x => x.uid !== p.uid && x.slug === newSlug)) throw new Error("Bu kullanıcı adı başka bir profilde kullanılıyor.");
    const taken = await db.collection("logins").doc(newSlug).get();
    if (taken.exists && taken.data().uid !== p.uid) throw new Error("Bu kullanıcı adı daha önce alınmış.");
    batch.set(db.collection("logins").doc(newSlug), { uid: p.uid, email: profEmail(p), at: Date.now() });
    if (p.slug) batch.set(db.collection("logins").doc(p.slug), { uid: p.uid, moved: true, at: Date.now() });
  }
  batch.update(db.collection("profiles").doc(p.uid), { name: newName, slug: newSlug, email: profEmail(p) });
  await batch.commit();
}

async function startApp(user) {
  const isRoot = (user.email || "").toLowerCase() === ADMIN_EMAIL;
  const pRef = db.collection("profiles").doc(user.uid);
  let pDoc = await pRef.get();
  if (!pDoc.exists) {
    if (!isRoot) { loginNotice = "Bu profil yönetici tarafından eklenmemiş."; await auth.signOut(); return; }
    await pRef.set({ name: pendingName || "Neriii", slug: ADMIN_EMAIL.split("@")[0], role: "admin", root: true, email: ADMIN_EMAIL, at: Date.now() });
    pDoc = await pRef.get();
  }
  const p = pDoc.data();
  if (p.disabled && !isRoot) { loginNotice = "Bu profil devre dışı bırakılmış. Yöneticiyle görüş."; await auth.signOut(); return; }
  pendingName = "";
  me = { uid: user.uid, name: p.name, email: user.email, isRoot, isAdmin: isRoot || p.role === "admin" };
  const fix = {};
  if (isRoot && p.root !== true) Object.assign(fix, { root: true, role: "admin" });
  if (!p.email) fix.email = user.email;
  if (Object.keys(fix).length) { try { await pRef.update(fix); } catch (e) {} }
  if (p.slug) {
    try {
      const lg = await db.collection("logins").doc(p.slug).get();
      if (!lg.exists) await db.collection("logins").doc(p.slug).set({ uid: user.uid, email: user.email, at: Date.now() });
    } catch (e) {}
  }

  const uDoc = await db.collection("userdata").doc(user.uid).get();
  const blob = uDoc.exists && uDoc.data().json ? JSON.parse(uDoc.data().json) : null;
  data = Object.assign(defaults(), blob || {});
  if (blob && !blob.v3) { await migrateBlob(blob); pushData(); }
  else if (!blob) pushData();

  $("login").hidden = true;
  $("login").replaceChildren();
  $("appRoot").hidden = false;
  $("band").hidden = false;
  const paintMe = () => {
    $("logoName").textContent = me.name + " ♡";
    $("logoShort").textContent = initial(me.name) + "♡";
    document.title = "Nerii, " + me.name;
    const ab = document.querySelector('#nav button[data-view="admin"]');
    if (ab) ab.hidden = !me.isAdmin;
  };
  paintMe();

  let firstIn = true;
  unsubs.push(db.collection("profiles").onSnapshot(snap => {
    allProfiles = snap.docs.map(d => Object.assign({ uid: d.id }, d.data()));
    profiles = allProfiles.filter(x => x.uid !== me.uid && !x.disabled);
    const mine = allProfiles.find(x => x.uid === me.uid);
    if (mine) {
      if (mine.disabled && !isRoot) { loginNotice = "Bu profil devre dışı bırakıldı."; logout(); return; }
      me.name = mine.name;
      me.isAdmin = isRoot || mine.role === "admin";
      if (!me.isAdmin && state.view === "admin") { go("home"); return; }
      paintMe();
    }
    if (["messages", "admin"].includes(state.view)) scheduleRender(); else updateHeader();
  }, () => {}));
  unsubs.push(db.collection("messages").where("to", "==", me.uid).onSnapshot(snap => {
    msgsIn = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    if (firstIn) {
      firstIn = false;
      const un = msgsIn.filter(m => !m.read).sort((a, b) => b.at - a.at);
      if (un.length) {
        const names = [...new Set(un.map(m => m.fromName))];
        showToast(un.length === 1 ? un[0].fromName + " sana bir mesaj bıraktı" : "Sana " + un.length + " yeni mesaj var",
          un.length === 1 ? un[0].text : names.join(", ") + " sana yazdı.",
          () => go("messages", { chatWith: un[0].from }), "Mesajlara git");
      }
    } else {
      snap.docChanges().forEach(ch => {
        const m = Object.assign({ id: ch.doc.id }, ch.doc.data());
        if (ch.type === "added" && !m.read && !(state.view === "messages" && state.chatWith === m.from && document.visibilityState === "visible")) {
          showToast(m.fromName + " sana yazdı", m.text, () => go("messages", { chatWith: m.from }), "Cevap ver");
        }
      });
    }
    if (state.view === "messages") scheduleRender(); else updateHeader();
  }, () => {}));
  unsubs.push(db.collection("messages").where("from", "==", me.uid).onSnapshot(snap => {
    msgsOut = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    if (state.view === "messages") scheduleRender();
  }, () => {}));

  let firstItems = 0;
  const startItems = () => {
    const onItems = (target, setter) => snap => {
      const m = new Map();
      snap.docs.forEach(d => m.set(d.id, Object.assign({ id: d.id }, d.data())));
      setter(m);
      itemsCache = null;
      if (firstItems < 2) { firstItems++; if (firstItems === 2) go(location.hash.slice(1) || "home"); return; }
      if (!["messages", "settings", "journal"].includes(state.view)) scheduleRender(); else updateHeader();
    };
    unsubs.push(itemsCol().where("vis", "==", "public").onSnapshot(onItems("pub", m => { pubItems = m; }), () => { if (firstItems < 2) { firstItems++; if (firstItems === 2) go(location.hash.slice(1) || "home"); } }));
    unsubs.push(itemsCol().where("owner", "==", me.uid).onSnapshot(onItems("mine", m => { myItems = m; }), () => { if (firstItems < 2) { firstItems++; if (firstItems === 2) go(location.hash.slice(1) || "home"); } }));
  };
  startItems();
  unsubs.push(db.collection("config").doc("site").onSnapshot(d => {
    site = d.exists ? d.data() : {};
    if (state.view === "home" && firstItems >= 2) scheduleRender();
  }, () => {}));
}

function logout() {
  lockAdmin();
  if (saveTimer) pushData();
  flushItems();
  unsubs.forEach(u => u());
  unsubs = [];
  setTimeout(() => auth.signOut().then(() => { history.replaceState(null, "", location.pathname); location.reload(); }), 300);
}

const RENDER = { home: renderHome, notes: renderNotes, goals: renderGoals, habits: renderHabits, calendar: renderCalendar, journal: renderJournal, affirm: renderAffirm, messages: renderMessages, shopping: renderShopping, books: renderBooks, settings: renderSettings, admin: renderAdmin };


function greeting() {
  const hr = new Date().getHours();
  if (hr >= 5 && hr < 12) return "Günaydın";
  if (hr >= 12 && hr < 18) return "İyi günler";
  if (hr >= 18 && hr < 22) return "İyi akşamlar";
  return "İyi geceler";
}


function updateHeader() {
  if (!me) return;
  const unread = unreadCount();
  $("greetTitle").textContent = greeting() + " " + me.name + " ♡";
  const p = plansOn(todayKey);
  const done = p.filter(i => i.done).length;
  const left = p.length - done;
  $("greetSub").textContent = unread ? "Sana " + unread + " yeni mesaj var ♡"
    : !p.length ? "Bugün harika şeyler başarabilirsin."
    : !left ? "Bugünkü planının hepsini tamamladın, tebrikler."
    : "Bugün planında " + p.length + " iş var, " + done + " tanesi tamam.";
  const now = new Date();
  $("clockDate").textContent = fmtDate.format(now);
  $("clockTime").textContent = fmtTime.format(now);
  const total = unread + left;
  $("bellBtn").innerHTML = ico("bell", 22) + (total ? '<span class="badge">' + total + "</span>" : "");
  $("bellBtn").setAttribute("aria-label", unread ? unread + " okunmamış mesaj" : left ? "Bugün " + left + " iş kaldı" : "Bildirimler");
  $("avatarBtn").textContent = initial(me.name);
  const mBtn = document.querySelector('#nav button[data-view="messages"] .lbl');
  if (mBtn) mBtn.textContent = unread ? "Mesajlar (" + unread + ")" : "Mesajlar";
}

function tick() {
  if (!me) return;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  if (now.getTime() !== today.getTime()) {
    today = now; todayKey = keyOf(today); state.calMonth = firstOfMonth(today);
    if (state.view === "home") scheduleRender();
  }
  updateHeader();
}

function searchAll(q) {
  q = q.toLocaleLowerCase("tr");
  const has = s => s && String(s).toLocaleLowerCase("tr").includes(q);
  const out = [];
  allItems().forEach(i => {
    if (i.kind === "note" && (has(i.title) || has(i.body))) out.push([i.title || "Başlıksız not", "Not", () => go("notes", { noteId: i.id })]);
    if (i.kind === "goal" && has(i.text)) out.push([i.text, "Hedef", () => go("goals")]);
    if (i.kind === "habit" && has(i.name)) out.push([i.name, "Alışkanlık", () => go("habits")]);
    if (i.kind === "plan" && has(i.text)) out.push([i.text, "Plan, " + fmtShort.format(fromKey(i.date)), () => go("calendar", { sel: i.date, calMonth: firstOfMonth(fromKey(i.date)) })]);
    if (i.kind === "shop" && has(i.text)) out.push([i.text, "Alışveriş listesi", () => go("shopping")]);
    if (i.kind === "book" && (has(i.title) || has(i.author))) out.push([i.title, "Kitap, " + i.status, () => go("books")]);
    if (i.kind === "aff" && has(i.text)) out.push([i.text, "Olumlama", () => go("affirm", { affFilter: "Eklenenler" })]);
  });
  const dAll = affDay();
  for (let i = dAll; i >= 0; i--) { const x = affAt(i); if (has(x.text)) out.push([x.text, "Olumlama, " + x.cat, () => go("affirm", { affFilter: x.cat })]); }
  Object.entries(data.journal).forEach(([k, e]) => { if (has(e.text) || (e.gratitude || []).some(has)) out.push([fmtDate.format(fromKey(k)), "Günlük", () => go("journal", { jDate: k })]); });
  return out.slice(0, 8);
}


const searchIn = $("search");
const resultsEl = $("results");
searchIn.addEventListener("input", () => {
  const q = searchIn.value.trim();
  if (q.length < 2) { resultsEl.hidden = true; return; }
  const res = searchAll(q);
  resultsEl.replaceChildren(...(res.length
    ? res.map(([label, kind, fn]) => h("li", {}, h("button", { type: "button", onclick: () => { searchIn.value = ""; resultsEl.hidden = true; fn(); } }, label, h("small", { text: kind }))))
    : [h("li", { class: "empty", style: "padding:.5rem .7rem", text: "Sonuç bulunamadı." })]));
  resultsEl.hidden = false;
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) resultsEl.hidden = true; });
searchIn.addEventListener("keydown", e => { if (e.key === "Escape") { searchIn.value = ""; resultsEl.hidden = true; } });

$("gsun").innerHTML = ico("sun", 44);
$("searchIco").innerHTML = ico("search", 18);
$("bellBtn").addEventListener("click", () => {
  const un = msgsIn.filter(m => !m.read).sort((a, b) => b.at - a.at);
  if (un.length) go("messages", { chatWith: un[0].from });
  else go("calendar", { sel: todayKey, calMonth: firstOfMonth(today) });
});
$("avatarBtn").addEventListener("click", () => go("settings"));


$("nav").append(...VIEWS.map(([v, label, icon]) =>
  h("button", { type: "button", "data-view": v, title: label, hidden: v === "admin", onclick: () => go(v) }, h("span", { html: ico(icon, 21), style: "display:grid" }), h("span", { class: "lbl", text: label }))
));
$("nav").append(h("button", { type: "button", class: "logout", title: "Çıkış yap", onclick: logout }, h("span", { html: ico("logout", 21), style: "display:grid" }), h("span", { class: "lbl", text: "Çıkış yap" })));

window.addEventListener("hashchange", () => { if (!me) return; const v = location.hash.slice(1); if (v !== state.view) go(v); });
setInterval(tick, 20000);

if (!FB_READY || typeof firebase === "undefined") {
  showLogin();
} else {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  auth.onAuthStateChanged(user => {
    if (user) startApp(user).catch(() => { loginNotice = "Veriler yüklenemedi. Firestore kurallarını ve internet bağlantını kontrol edip tekrar dene."; auth.signOut(); });
    else { me = null; showLogin(loginNotice); loginNotice = ""; }
  });
}
